<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화정 응원가 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120808; --panel:rgba(30,14,14,.78); --line:rgba(255,255,255,.12);
    --red:#e3262b; --accent:#e3262b; --accent-glow:rgba(227,38,43,.55); --red-deep:#9c1418; --gold:#ffc93c; --text:#fff6ee; --dim:rgba(255,246,238,.62);
    --display:"Black Han Sans","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:var(--body);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* blurred backdrop made from the current photo */
  .backdrop{position:fixed;inset:-40px;z-index:-1;background:var(--bg)}
  .backdrop div{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) saturate(1.1);opacity:0;transition:opacity .55s ease}
  .backdrop div.on{opacity:.55}
  .backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,8,8,.35),rgba(18,8,8,.9) 62%,var(--bg))}

  .wrap{max-width:860px;margin:0 auto;padding:14px 14px 56px}
  header{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:6px 2px 12px}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,34px);letter-spacing:.01em;line-height:1.1}
  h1 em{font-style:normal;color:var(--gold)}
  .sub{font-size:clamp(13px,3.6vw,15px);color:var(--text)}
  .sub b{color:var(--gold)}
  .sample{font-size:clamp(12px,3.3vw,14px);font-weight:700;color:#2a1200;background:var(--gold);padding:3px 10px;border-radius:999px}

  /* stage: photo + lyrics */
  .stage{position:relative;aspect-ratio:3/2;border-radius:0 0 18px 18px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.55);border:1px solid var(--line)}
  .slide{position:absolute;inset:0;background-size:cover;background-position:center 35%;opacity:0;transition:opacity .55s ease;transform:scale(1.02)}
  .slide.on{opacity:1;animation:drift 3s ease-out forwards}
  @keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09)}}
  .stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 48%,rgba(10,3,3,.7) 76%,rgba(10,3,3,.94) 100%);pointer-events:none}
  .mvbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--accent);border-radius:18px 18px 0 0;transition:background .3s}
  .mvbar .lbl{display:flex;align-items:baseline;gap:6px;flex:none}
  .mvbar small{font-family:var(--display);font-size:clamp(18px,5vw,24px);line-height:1}
  .mvbar b{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:.85;color:var(--gold)}
  .mvbar i{flex:1;min-width:0;font-style:normal;font-size:clamp(15px,4.4vw,20px);font-weight:700;padding-left:10px;border-left:1.5px solid rgba(255,255,255,.45);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mvbar .nav{flex:none;display:flex;gap:6px}
  .mvbar .nav button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.22);display:grid;place-items:center}
  .mvbar .nav button:disabled{opacity:.3}
  .mvbar .nav svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .lyrics{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 12px 10px;text-align:center}
  .now{font-family:var(--display);font-size:clamp(20px,5.8vw,44px);line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.85);min-height:1.2em;word-break:keep-all}
  .now.pop{animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
  .now.shout{color:var(--gold);font-size:clamp(28px,8.4vw,64px);letter-spacing:.06em}
  @keyframes pop{from{transform:translateY(10px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  .next{margin-top:3px;font-size:clamp(12px,3.4vw,17px);color:var(--dim);min-height:1.4em;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .bigplay{position:absolute;inset:0 0 34% 0;z-index:3;display:grid;place-items:center}
  .bigplay span{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 30px var(--accent-glow)}
  .bigplay svg{width:30px;height:30px;margin-left:5px;fill:#fff}
  .bigplay.hide{display:none}

  /* player */
  .player{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px)}
  .row{display:flex;align-items:center;gap:12px}
  .pp{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
  .pp svg{width:20px;height:20px;fill:#fff}
  .meta{flex:1;min-width:0}
  .meta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta small{font-size:12px;color:var(--dim)}
  .like{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:15px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.35);font-weight:700;font-size:19px;transition:transform .15s,background .2s,border-color .2s}
  .like svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2}
  .like #likeN{font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold);min-width:1ch}
  .like.on #likeN{color:#fff}
  .likeHint{margin-top:8px;font-size:13px;text-align:center;color:var(--gold)}
  .likeHint:empty{display:none}
  .like.on{background:var(--accent);border-color:var(--accent)}
  .like.on svg{fill:#fff;stroke:#fff}
  .like:active{transform:scale(.93)}
  .like.bump svg{animation:bump .4s}
  @keyframes bump{40%{transform:scale(1.45)}}
  .dl{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);color:var(--text);text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap}
  .dl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .dl:active{background:var(--accent);border-color:var(--accent)}
  .seek{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;appearance:none;-webkit-appearance:none;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold) var(--p,0%),rgba(255,255,255,.2) var(--p,0%))}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
  input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--gold)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}

  /* candidates */
  h2{font-family:var(--display);font-weight:400;font-size:19px;margin:26px 2px 10px;display:flex;align-items:baseline;gap:8px}
  h2 small{font-family:var(--body);font-size:12px;color:var(--dim)}
  .songs{display:grid;gap:8px}
  .song{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line)}
  .song.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
  .song .no{font-family:var(--display);font-size:20px;color:#fff;background:var(--c);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
  .song .t{flex:1;min-width:0}
  .song .t b{display:block;font-size:15px}
  .song .t small{font-size:12px;color:var(--dim)}
  .song .cnt{font-size:13px;color:var(--dim);white-space:nowrap}
  .soon{padding:11px 14px;border-radius:14px;border:1.5px dashed var(--line);color:var(--dim);font-size:13px;text-align:center}

  /* comments */
  .cform{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
  .cform input,.cform textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .cform textarea{margin-top:8px;resize:vertical;min-height:68px}
  .cform .row{margin-top:8px;justify-content:space-between}
  .cform .hint{font-size:12px;color:var(--dim)}
  .send{padding:10px 18px;border-radius:10px;background:var(--gold);color:#2a1200;font-weight:700}
  .send:disabled{opacity:.45}
  .clist{margin-top:10px;display:grid;gap:8px}
  .c{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .c .h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .c .h b{color:var(--gold);font-size:13px}
  .c .h button{margin-left:auto;font-size:12px;color:var(--dim);text-decoration:underline;padding:4px}
  .c p{margin-top:5px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:18px 0}

  /* full lyrics */
  details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:26px}
  summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  summary::after{content:"펼치기";font-weight:400;font-size:12px;color:var(--dim)}
  details[open] summary::after{content:"접기"}
  .full{padding:0 8px 12px}
  .full button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:15px;color:var(--dim)}
  .full button.cur{color:var(--text);background:var(--accent);font-weight:700}
  .full button i{font-style:normal;font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums;opacity:.7}
  .full .sec{font-size:11px;letter-spacing:.08em;color:var(--gold);padding:12px 10px 4px}

  .note{margin-top:22px;font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
  .sync{display:none;margin-top:14px;background:#2a1200;border:1.5px solid var(--gold);border-radius:16px;padding:14px}
  .sync.on{display:block}
  .sync p{font-size:13px;line-height:1.6}
  .sync .tap{width:100%;margin:10px 0;padding:18px;border-radius:12px;background:var(--gold);color:#2a1200;font-weight:700;font-size:17px}
  .sync textarea{width:100%;height:110px;font:12px/1.4 ui-monospace,monospace;background:#000;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
  @media (min-width:720px){.stage{aspect-ratio:16/9}.wrap{padding-top:22px}.mvbar{padding:10px 12px 10px 18px}}
  @media (max-width:480px){
    .wrap{padding:10px 10px 48px}
    header{padding:2px 2px 10px}
    .player{margin-top:10px;padding:10px 12px}
    .like{margin-top:10px;padding:13px 16px}
    h2{margin-top:22px}
  }
  @media (prefers-reduced-motion:reduce){.slide.on,.now.pop,.like.bump svg{animation:none}}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"><div></div><div></div></div>
<div class="wrap">
  <header>
    <h1>화정 응원가 <em>투표</em></h1>
    <span class="sub">맘에 드는 음악에 좋아요를 눌러주세요 <b>(최대 2개)</b></span>
    <span class="sample">가사는 샘플입니다.</span>
  </header>

  <div class="mvbar" id="mvbar">
    <span class="lbl"><small>후보</small><b id="badgeNo"></b></span><i id="badgeStyle"></i>
    <span class="nav"><button id="prevSong" aria-label="이전 후보"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="nextSong" aria-label="다음 후보"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></span>
  </div>
  <section class="stage" id="stage" aria-label="가사 화면">
    <div class="slide"></div><div class="slide"></div>
    <div class="lyrics" aria-live="off">
      <div class="now" id="now"></div>
      <div class="next" id="next"></div>
    </div>
    <button class="bigplay" id="bigplay" aria-label="재생"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>
  </section>

  <section class="player">
    <div class="row">
      <button class="pp" id="pp" aria-label="재생/일시정지"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M6 4l14 8-14 8z"/></svg></button>
      <div class="meta"><b id="mTitle"></b><small id="mSub"></small></div>
      <a class="dl" id="dl" href="#" download><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>원음 받기</span></a>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="재생 위치"><span id="dur">0:00</span></div>
    <button class="like" id="like" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.800 3.500 4.500 6.900 4.500c2 0 3.700 1.100 5.100 3 1.400-1.900 3.100-3 5.100-3 3.400 0 5.500 3.300 4.200 6.800-1.800 4.600-9.300 9.200-9.300 9.200z"/></svg><span id="likeT">좋아요</span><span id="likeN">0</span></button>
    <div class="likeHint" id="likeHint" role="status"></div>
  </section>

  <div class="sync" id="sync">
    <p><b>가사 싱크 맞추기</b> — 노래를 처음부터 재생하고, 각 줄이 <b>시작되는 순간</b> 아래 버튼을 누르세요. 다음에 찍을 줄: <b id="syncLine"></b></p>
    <button class="tap" id="syncTap">지금!</button>
    <div class="row"><button class="send" id="syncReset">처음부터 다시</button><button class="send" id="syncCopy">결과 복사</button></div>
    <p style="margin-top:10px">찍은 타이밍은 바로 화면에 적용됩니다. 아래 내용을 복사해서 Claude에게 보내면 페이지에 반영됩니다.</p>
    <textarea id="syncOut" readonly></textarea>
  </div>

  <h2>후보곡 <small>들어보고 마음에 들면 ♥</small></h2>
  <div class="songs" id="songs"></div>

  <h2>의견 <small id="cCount"></small></h2>
  <form class="cform" id="cform">
    <input id="nick" maxlength="20" placeholder="이름 (예: 3번 OO 아빠)" autocomplete="nickname">
    <textarea id="body" maxlength="300" placeholder="이 노래 어떤가요? 가사·멜로디·빠르기 등 자유롭게 남겨주세요"></textarea>
    <div class="row"><span class="hint" id="cHint"></span><button class="send" id="send" type="submit">남기기</button></div>
  </form>
  <div class="clist" id="clist"></div>

  <details id="fullBox"><summary>전체 가사</summary><div class="full" id="full"></div></details>

  <p class="note" id="modeNote"></p>
</div>

<audio id="audio" preload="metadata"></audio>

const mem = {};

  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const LocalStore = {
  shared: false,
  async load(){ const likes = ls.get("cheer.likes", {}); return { likes, counts: {}, comments: ls.get("cheer.comments", []) }; },
  async toggleLike(songId){
    const likes = ls.get("cheer.likes", {}); likes[songId] = !likes[songId]; ls.set("cheer.likes", likes);
    return { liked: !!likes[songId], count: likes[songId] ? 1 : 0 };
  },
  async addComment(songId, nick, body){
    const list = ls.get("cheer.comments", []);
    const c = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), song_id: songId, nick, body, created_at: new Date().toISOString(), mine: true };
    list.unshift(c); ls.set("cheer.comments", list); return c;
  },
  async deleteComment(id){ ls.set("cheer.comments", ls.get("cheer.comments", []).filter(c => c.id !== id)); }
};

function deviceId(){
  let d = ls.get("cheer.device", null);
  if (!d){ d = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : "d-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); ls.set("cheer.device", d); }
  return d;
}
async function rpc(fn, args){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try{
    const r = await fetch(SB.url + "/rest/v1/rpc/" + fn, { method: "POST", signal: ctl.signal,
      headers: { apikey: SB.key, Authorization: "Bearer " + SB.key, "Content-Type": "application/json" }, body: JSON.stringify(args) });
    if (!r.ok) throw new Error(fn + " " + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

  shared: true,
  async load(){

    return { likes, counts: d.likes || {}, comments: d.comments || [] };
  },
  toggleLike(songId){ return rpc("cheer_toggle_like", { p_song: songId, p_device: deviceId() }); },

    const r = await rpc("cheer_add_comment", { p_song: songId, p_device: deviceId(), p_nick: nick, p_body: body });
    return { id: r.id, song_id: songId, nick, body, created_at: r.created_at, mine: true };

  $("badgeNo").textContent = si + 1;
  $("dl").href = s.src; $("dl").setAttribute("download", "화정응원가_후보" + (si + 1) + "_" + s.style.replace(/\s+/g, "_") + ".mp3");
  $("dl").setAttribute("aria-label", s.title + " 원음 MP3 내려받기"); $("badgeStyle").textContent = s.style; $("mTitle").textContent = s.title + " · " + s.style; $("mSub").textContent = "화정초 야구부 응원가";
  buildFull(); renderSongs(); renderLike(); renderComments(); renderLine(true); syncShow();
}

/* ---------- comments ---------- */
function renderComments(){
  const list = state.comments.filter(c => c.song_id === song.id), box = $("clist"); box.textContent = "";
  $("cCount").textContent = song.title + " · " + list.length + "개";
  if (!list.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "아직 의견이 없습니다. 첫 의견을 남겨주세요!"; box.appendChild(e); return; }
  list.forEach(c => {
    const el = document.createElement("div"); el.className = "c";
    const h = document.createElement("div"); h.className = "h";
    const n = document.createElement("b"); n.textContent = c.nick;
    const d = document.createElement("span"); const dt = new Date(c.created_at);
    d.textContent = (dt.getMonth() + 1) + "/" + dt.getDate() + " " + String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0");
    h.append(n, d);
    if (c.mine){ const x = document.createElement("button"); x.textContent = "삭제";
      x.onclick = async () => { if (x.dataset.sure){ await Store.deleteComment(c.id); state.comments = state.comments.filter(y => y.id !== c.id); renderComments(); renderSongs(); } else { x.dataset.sure = 1; x.textContent = "정말 삭제?"; setTimeout(() => { delete x.dataset.sure; x.textContent = "삭제"; }, 3000); } };
      h.appendChild(x); }
    const p = document.createElement("p"); p.textContent = c.body; el.append(h, p); box.appendChild(el);
  });
}
$("nick").value = ls.get("cheer.nick", "");
$("cform").addEventListener("submit", async e => {
  e.preventDefault();
  const nick = $("nick").value.trim(), body = $("body").value.trim(), hint = $("cHint");
  if (!nick){ hint.textContent = "이름을 적어주세요"; $("nick").focus(); return; }
  if (!body){ hint.textContent = "의견을 적어주세요"; $("body").focus(); return; }
  $("send").disabled = true;
  try{ const c = await Store.addComment(song.id, nick, body); state.comments.unshift(c); ls.set("cheer.nick", nick); $("body").value = ""; hint.textContent = "등록되었습니다"; renderComments(); renderSongs(); }
  catch(err){ hint.textContent = "등록하지 못했습니다. 잠시 후 다시 시도해주세요"; }
  $("send").disabled = false;
});

/* ---------- sync tool (주소 끝에 #sync) ---------- */
let syncPos = 0;
function syncShow(){
  $("sync").classList.toggle("on", location.hash === "#sync");
  $("syncLine").textContent = song.lines[syncPos] ? song.lines[syncPos][1] : "(끝)";
  $("syncOut").value = song.id + "\n" + song.lines.map(l => l[0].toFixed(2) + "\t" + l[1]).join("\n");
}
$("syncTap").onclick = () => { if (!song.lines[syncPos]) return; song.lines[syncPos][0] = Math.max(0, +(audio.currentTime - 0.15).toFixed(2)); syncPos++; buildFull(); syncShow(); };
$("syncReset").onclick = () => { syncPos = 0; audio.currentTime = 0; syncShow(); };
$("syncCopy").onclick = () => { $("syncOut").select(); try{ navigator.clipboard.writeText($("syncOut").value).then(() => { $("syncCopy").textContent = "복사됨"; }, () => {}); }catch(e){} };
window.addEventListener("hashchange", syncShow);

$("prevSong").onclick = () => { const i = SONGS.indexOf(song); if (i > 0) selectSong(SONGS[i - 1]); };
$("nextSong").onclick = () => { const i = SONGS.indexOf(song); if (i < SONGS.length - 1) selectSong(SONGS[i + 1]); };

/* ---------- start ---------- */
selectSong(SONGS[0]);
function applyData(d){ state.likes = d.likes || {}; state.counts = d.counts || {}; state.comments = d.comments || []; renderSongs(); renderLike(); renderComments(); }
RemoteStore.load().then(d => { Store = RemoteStore; applyData(d); })
  .catch(() => { Store = LocalStore; $("modeNote").textContent = "미리보기 모드 — 좋아요와 의견은 지금 이 기기에만 저장되며, 다른 사람에게는 보이지 않습니다."; return LocalStore.load().then(applyData); });
</script>
